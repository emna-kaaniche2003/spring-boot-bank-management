<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title th:text="${compte.rib != null} ? 'Modifier Compte' : 'Nouveau Compte'">Compte</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"/>
    <link href="https://code.jquery.com/ui/1.13.2/themes/base/jquery-ui.css" rel="stylesheet"/>
    <link th:href="@{/css/style.css}" rel="stylesheet"/>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
    <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{/}">
            <i class="bi bi-bank2 me-2"></i>BanqueApp
        </a>
        <div class="collapse navbar-collapse" id="navbarMain">
            <ul class="navbar-nav ms-auto align-items-center">
                <li class="nav-item"><a class="nav-link" th:href="@{/clients}">Clients</a></li>
                <li class="nav-item"><a class="nav-link active" th:href="@{/comptes}">Comptes</a></li>
                <li class="nav-item">
                    <form th:action="@{/logout}" method="post" class="d-inline">
                        <button type="submit" class="btn btn-outline-light btn-sm ms-2">Déconnexion</button>
                    </form>
                </li>
            </ul>
        </div>
    </div>
</nav>

<main class="container my-4">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-sm">
                <div class="card-header bg-primary text-white">
                    <h5 class="mb-0">
                        <i class="bi bi-credit-card me-2"></i>
                        <span th:text="${compte.rib != null} ? 'Modifier le Compte' : 'Ajouter un Compte'"></span>
                    </h5>
                </div>
                <div class="card-body">
                    <form th:action="@{/comptes/save}" method="post">

                        <input type="hidden" name="rib" th:value="${compte.rib}"/>

                        <div class="mb-3">
                            <label for="solde" class="form-label fw-semibold">
                                Solde (TND) <span class="text-danger">*</span>
                            </label>
                            <input type="number" step="0.01" class="form-control"
                                   id="solde" name="solde"
                                   th:value="${compte.solde}"
                                   placeholder="Ex: 1500.00"
                                   required/>
                        </div>

                        <div class="mb-3">
                            <label for="clientSearch" class="form-label fw-semibold">
                                Client <span class="text-danger">*</span>
                            </label>

                            <input type="text" class="form-control" id="clientSearch"
                                   th:classappend="${compte.rib != null} ? 'bg-light text-muted' : ''"
                                   th:readonly="${compte.rib != null}"
                                   th:value="${compte.client != null}
                                       ? ${compte.client.nom + ' ' + compte.client.prenom + ' (' + compte.client.cin + ')'}
                                       : ''"
                                   placeholder="Tapez un nom ou CIN..."
                                   autocomplete="off"/>

                            <input type="hidden" id="clientCin" name="clientCin"
                                   th:value="${compte.client != null} ? ${compte.client.cin} : ''"/>

                            <div th:if="${compte.rib == null}" class="form-text text-muted">
                                Commencez à taper pour rechercher un client.
                            </div>
                        </div>

                        <div class="d-flex justify-content-between">
                            <a th:href="@{/comptes}" class="btn btn-secondary">
                                <i class="bi bi-arrow-left me-1"></i>Annuler
                            </a>
                            <button type="submit" class="btn btn-primary" id="btnSave"
                                    th:disabled="${compte.client == null}">
                                <i class="bi bi-save me-1"></i>Enregistrer
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</main>

<script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
<script src="https://code.jquery.com/ui/1.13.2/jquery-ui.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>
    $(document).ready(function () {

        const clientInput = $("#clientSearch");
        const cinHidden = $("#clientCin");
        const btnSave = $("#btnSave");

        // Si le champ n'est pas en lecture seule, on active l'autocomplete
        if (!clientInput.prop("readonly")) {
            clientInput.autocomplete({
                source: function (request, response) {
                    $.ajax({
                        url: "/clients/autocomplete",
                        type: "GET",
                        data: { term: request.term },
                        success: function (data) {
                            response(data);
                        }
                    });
                },
                minLength: 1,
                select: function (event, ui) {
                    // ui.item.id contient le CIN renvoyé par l'autocomplete
                    cinHidden.val(ui.item.id);
                    btnSave.prop("disabled", false);
                },
                change: function () {
                    // Si l'utilisateur efface tout, on bloque le bouton
                    if ($(this).val() === "") {
                        cinHidden.val("");
                        btnSave.prop("disabled", true);
                    }
                }
            });
        } else {
            // En mode édition (readonly), on s'assure que le bouton est activable
            btnSave.prop("disabled", false);
        }
    });
</script>
</body>
</html>
