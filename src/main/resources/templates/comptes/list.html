<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Liste des Comptes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"/>
    <link th:href="@{/css/style.css}" rel="stylesheet"/>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
    <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{/}">
            <i class="bi bi-bank2 me-2"></i>BanqueApp
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarMain">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarMain">
            <ul class="navbar-nav ms-auto align-items-center">
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/clients}">
                        <i class="bi bi-people-fill me-1"></i>Clients
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link active" th:href="@{/comptes}">
                        <i class="bi bi-credit-card-fill me-1"></i>Comptes
                    </a>
                </li>
                <li class="nav-item">
                    <form th:action="@{/logout}" method="post" class="d-inline">
                        <button type="submit" class="btn btn-outline-light btn-sm ms-2">
                            <i class="bi bi-box-arrow-right me-1"></i>Déconnexion
                        </button>
                    </form>
                </li>
            </ul>
        </div>
    </div>
</nav>

<main class="container my-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2 class="fw-bold text-primary">
            <i class="bi bi-credit-card-fill me-2"></i>Gestion des Comptes
        </h2>
        <a th:href="@{/comptes/new}" class="btn btn-success">
            <i class="bi bi-plus-circle me-1"></i>Nouveau Compte
        </a>
    </div>

    <div class="card shadow-sm">
        <div class="card-body p-0">
            <table class="table table-striped table-hover table-bordered mb-0 align-middle">
                <thead class="table-primary">
                <tr>
                    <th><i class="bi bi-hash me-1"></i>RIB</th>
                    <th><i class="bi bi-currency-dollar me-1"></i>Solde (TND)</th>
                    <th><i class="bi bi-person-badge me-1"></i>CIN Client</th>
                    <th><i class="bi bi-person me-1"></i>Nom Complet</th>
                    <th class="text-center">Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:if="${#lists.isEmpty(comptes)}">
                    <td colspan="5" class="text-center text-muted py-3">
                        <i class="bi bi-inbox me-2"></i>Aucun compte enregistré.
                    </td>
                </tr>
                <tr th:each="compte : ${comptes}" th:id="${compte.rib}">
                    <td th:text="${compte.rib}"></td>
                    <td>
                            <span class="badge"
                                  th:classappend="${compte.solde >= 0} ? 'bg-success' : 'bg-danger'"
                                  th:text="${#numbers.formatDecimal(compte.solde, 1, 3)} + ' TND'">
                            </span>
                    </td>
                    <td th:text="${compte.client.cin}"></td>
                    <td th:text="${compte.client.nom + ' ' + compte.client.prenom}"></td>
                    <td class="text-center">
                        <a th:href="@{/comptes/edit/{rib}(rib=${compte.rib})}"
                           class="btn btn-sm btn-warning me-1">
                            <i class="bi bi-pencil-fill"></i>
                        </a>
                        <button class="btn btn-sm btn-danger btn-delete-compte"
                                th:data-rib="${compte.rib}">
                            <i class="bi bi-trash-fill"></i>
                        </button>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
<script src="https://unpkg.com/sweetalert/dist/sweetalert.min.js"></script>
<script>
    $(document).ready(function () {
        $(".btn-delete-compte").on("click", function () {
            var rib = $(this).data("rib");

            swal({
                title: "Confirmer la suppression",
                text: "Supprimer le compte RIB " + rib + " ?",
                icon: "warning",
                buttons: ["Annuler", "Supprimer"],
                dangerMode: true
            }).then(function (confirm) {
                if (confirm) {
                    $.ajax({
                        url: "/comptes/delete",
                        type: "POST",
                        data: { rib: rib },
                        success: function () {
                            $("#" + rib).remove();
                            swal("Supprimé !", "Le compte a été supprimé.", "success");
                        },
                        error: function () {
                            swal("Erreur !", "Une erreur serveur est survenue.", "error");
                        }
                    });
                }
            });
        });
    });
</script>
</body>
</html>
