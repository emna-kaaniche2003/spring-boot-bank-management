<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title th:text="${client.cin != null} ? 'Modifier Client' : 'Nouveau Client'">Client</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"/>
    <link th:href="@{/css/style.css}" rel="stylesheet"/>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
    <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{/}">
            <i class="bi bi-bank2 me-2"></i>BanqueApp
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarMain">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarMain">
            <ul class="navbar-nav ms-auto align-items-center">
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/clients}">
                        <i class="bi bi-people-fill me-1"></i>Clients
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link active" th:href="@{/comptes}">
                        <i class="bi bi-credit-card-fill me-1"></i>Comptes
                    </a>
                </li>
                <li class="nav-item">
                    <form th:action="@{/logout}" method="post" class="d-inline">
                        <button type="submit" class="btn btn-outline-light btn-sm ms-2">
                            <i class="bi bi-box-arrow-right me-1"></i>Déconnexion
                        </button>
                    </form>
                </li>
            </ul>
        </div>
    </div>
</nav>

<main class="container my-4">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-sm">
                <div class="card-header bg-primary text-white">
                    <h5 class="mb-0">
                        <i class="bi bi-person-fill me-2"></i>
                        <span th:text="${client.cin != null} ? 'Modifier le Client' : 'Ajouter un Client'"></span>
                    </h5>
                </div>
                <div class="card-body">
                    <form th:action="@{/clients/save}" method="post">

                        <div class="mb-3">
                            <label for="cin" class="form-label fw-semibold">
                                CIN <span class="text-danger">*</span>
                            </label>
                            <input type="text" class="form-control" id="cin" name="cin"
                                   th:value="${client.cin}"
                                   th:readonly="${client.cin != null}"
                                   placeholder="Ex: 12345678"
                                   required/>
                        </div>

                        <div class="mb-3">
                            <label for="nom" class="form-label fw-semibold">
                                Nom <span class="text-danger">*</span>
                            </label>
                            <input type="text" class="form-control" id="nom" name="nom"
                                   th:value="${client.nom}"
                                   placeholder="Ex: Ben Ali"
                                   required/>
                        </div>

                        <div class="mb-3">
                            <label for="prenom" class="form-label fw-semibold">
                                Prénom <span class="text-danger">*</span>
                            </label>
                            <input type="text" class="form-control" id="prenom" name="prenom"
                                   th:value="${client.prenom}"
                                   placeholder="Ex: Mohamed"
                                   required/>
                        </div>

                        <div class="d-flex justify-content-between">
                            <a th:href="@{/clients}" class="btn btn-secondary">
                                <i class="bi bi-arrow-left me-1"></i>Annuler
                            </a>
                            <button type="submit" class="btn btn-primary">
                                <i class="bi bi-save me-1"></i>Enregistrer
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
