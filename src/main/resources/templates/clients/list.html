<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Liste des Clients</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"/>
    <link th:href="@{/css/style.css}" rel="stylesheet"/>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
    <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{/}">
            <i class="bi bi-bank2 me-2"></i>BanqueApp
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarMain">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarMain">
            <ul class="navbar-nav ms-auto align-items-center">
                <li class="nav-item">
                    <a class="nav-link active" th:href="@{/clients}">
                        <i class="bi bi-people-fill me-1"></i>Clients
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/comptes}">
                        <i class="bi bi-credit-card-fill me-1"></i>Comptes
                    </a>
                </li>
                <li class="nav-item">
                    <form th:action="@{/logout}" method="post" class="d-inline">
                        <button type="submit" class="btn btn-outline-light btn-sm ms-2">
                            <i class="bi bi-box-arrow-right me-1"></i>Déconnexion
                        </button>
                    </form>
                </li>
            </ul>
        </div>
    </div>
</nav>

<main class="container my-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2 class="fw-bold text-primary">
            <i class="bi bi-people-fill me-2"></i>Gestion des Clients
        </h2>
        <a th:href="@{/clients/new}" class="btn btn-success">
            <i class="bi bi-plus-circle me-1"></i>Nouveau Client
        </a>
    </div>

    <div class="card shadow-sm">
        <div class="card-body p-0">
            <table class="table table-striped table-hover table-bordered mb-0 align-middle">
                <thead class="table-primary">
                <tr>
                    <th><i class="bi bi-person-badge me-1"></i>CIN</th>
                    <th><i class="bi bi-person me-1"></i>Nom</th>
                    <th><i class="bi bi-person me-1"></i>Prénom</th>
                    <th class="text-center">Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:if="${#lists.isEmpty(clients)}">
                    <td colspan="4" class="text-center text-muted py-3">
                        <i class="bi bi-inbox me-2"></i>Aucun client enregistré.
                    </td>
                </tr>
                <tr th:each="client : ${clients}" th:id="${client.cin}">
                    <td th:text="${client.cin}"></td>
                    <td th:text="${client.nom}"></td>
                    <td th:text="${client.prenom}"></td>
                    <td class="text-center">
                        <a th:href="@{/clients/edit/{cin}(cin=${client.cin})}"
                           class="btn btn-sm btn-warning me-1">
                            <i class="bi bi-pencil-fill"></i>
                        </a>
                        <button class="btn btn-sm btn-danger btn-delete-client"
                                th:data-cin="${client.cin}"
                                th:data-nom="${client.nom + ' ' + client.prenom}">
                            <i class="bi bi-trash-fill"></i>
                        </button>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
<script src="https://unpkg.com/sweetalert/dist/sweetalert.min.js"></script>
<script>
    $(document).ready(function () {
        $(".btn-delete-client").on("click", function () {
            var cin = $(this).data("cin");
            var nom = $(this).data("nom");

            swal({
                title: "Confirmer la suppression",
                text: "Supprimer le client « " + nom + " »  ?",
                icon: "warning",
                buttons: ["Annuler", "Supprimer"],
                dangerMode: true
            }).then(function (confirm) {
                if (confirm) {
                    $.ajax({
                        url: "/clients/delete",
                        type: "POST",
                        data: { cin: cin },
                        success: function () {
                            $("#" + CSS.escape(cin)).remove();
                            swal("Supprimé !", "Le client a été supprimé.", "success");
                        },
                        error: function () {
                            swal("Erreur !", "Le client a au moins un compte.", "error");
                        }
                    });
                }
            });
        });
    });
</script>
</body>
</html>
