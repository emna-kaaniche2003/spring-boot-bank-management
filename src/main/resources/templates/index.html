<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Accueil - BanqueApp</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"/>
    <link th:href="@{/css/style.css}" rel="stylesheet"/>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
    <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{/}">
            <i class="bi bi-bank2 me-2"></i>BanqueApp
        </a>
        <div class="collapse navbar-collapse">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/clients}">
                        <i class="bi bi-people-fill me-1"></i>Clients
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/comptes}">
                        <i class="bi bi-credit-card-fill me-1"></i>Comptes
                    </a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<main class="container my-5 text-center">
    <div class="py-5">
        <i class="bi bi-bank2 display-1 text-primary"></i>
        <h1 class="mt-3 fw-bold">Bienvenue sur BanqueApp</h1>
        <p class="lead text-muted">Système de gestion des clients et comptes bancaires</p>
        <div class="mt-4 d-flex justify-content-center gap-3">
            <a th:href="@{/clients}" class="btn btn-primary btn-lg">
                <i class="bi bi-people-fill me-2"></i>Gérer les Clients
            </a>
            <a th:href="@{/comptes}" class="btn btn-outline-primary btn-lg">
                <i class="bi bi-credit-card-fill me-2"></i>Gérer les Comptes
            </a>
        </div>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
